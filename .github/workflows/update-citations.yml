name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 3 * * *" # 11:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt \
            || pip install "bibtexparser<2" scholarly

      - name: Hash current scholar.json
        id: before
        run: |
          if [ -f data/scholar.json ]; then
            echo "sha=$(sha256sum data/scholar.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch citations from Google Scholar
        id: fetch
        continue-on-error: true
        env:
          GOOGLE_SCHOLAR_ID: ${{ vars.GOOGLE_SCHOLAR_ID || 'cXJ2lKAAAAAJ' }}
          SCHOLAR_PROXY: ${{ vars.SCHOLAR_PROXY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCHOLAR_ATTEMPTS: "3"
        run: python scripts/update_scholar_citations.py

      - name: Hash new scholar.json
        id: after
        run: |
          if [ -f data/scholar.json ]; then
            echo "sha=$(sha256sum data/scholar.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Report result
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            echo "### Scholar fetch succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Scholar fetch FAILED - keeping previous data" >> "$GITHUB_STEP_SUMMARY"
            echo "Google most likely rate-limited the runner IP. Retry later; if it keeps "
            echo "failing, set the \`SCRAPERAPI_KEY\` secret and \`SCHOLAR_PROXY=scraper\` variable." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.before.outputs.sha }}" != "${{ steps.after.outputs.sha }}" ]; then
            echo "data/scholar.json changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No change in data/scholar.json - nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push if changed
        if: steps.before.outputs.sha != steps.after.outputs.sha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git diff --staged --quiet || git commit -m "chore: update Google Scholar citations"
          git push
