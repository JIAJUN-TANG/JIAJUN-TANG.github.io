<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="内容从 Markdown 文件到上线的流水线">
  <defs>
    <style>
      .h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .t { font-size: 19px; font-weight: 600; fill: #1C1917; }
      .d { font-size: 14px; fill: #78716C; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; fill: #0D9488; }
      .box { fill: #FFFFFF; stroke: #E7E5E4; stroke-width: 1.5; }
      .arrow { stroke: #A8A29E; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8A29E" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="#FAFAF8" />

  <text class="h t" x="60" y="64">从 Markdown 到上线的流水线</text>
  <text class="h d" x="60" y="92">所有内容都先变成文件，再交给构建，最后只留下静态产物。</text>

  <!-- 1 -->
  <rect class="box" x="60" y="140" width="220" height="150" rx="12" />
  <text class="h t" x="84" y="180" font-size="17">写内容</text>
  <text class="h m" x="84" y="212">blog/*.md</text>
  <text class="h m" x="84" y="236">data/content.json</text>
  <text class="h d" x="84" y="266">中台保存 → 校验 → 备份</text>

  <line class="arrow" x1="296" y1="215" x2="348" y2="215" marker-end="url(#tip)" />

  <!-- 2 -->
  <rect class="box" x="364" y="140" width="220" height="150" rx="12" />
  <text class="h t" x="388" y="180" font-size="17">构建</text>
  <text class="h m" x="388" y="212">vite build</text>
  <text class="h d" x="388" y="240">Markdown 编译期读入</text>
  <text class="h d" x="388" y="264">素材带上内容哈希</text>

  <line class="arrow" x1="600" y1="215" x2="652" y2="215" marker-end="url(#tip)" />

  <!-- 3 -->
  <rect class="box" x="668" y="140" width="220" height="150" rx="12" />
  <text class="h t" x="692" y="180" font-size="17">产物</text>
  <text class="h m" x="692" y="212">dist/assets/*</text>
  <text class="h d" x="692" y="240">纯静态 HTML / JS / CSS</text>
  <text class="h d" x="692" y="264">无后台、无数据库</text>

  <line class="arrow" x1="904" y1="215" x2="956" y2="215" marker-end="url(#tip)" />

  <!-- 4 -->
  <rect class="box" x="972" y="140" width="168" height="150" rx="12" />
  <text class="h t" x="996" y="180" font-size="17">上线</text>
  <text class="h m" x="996" y="212">git push</text>
  <text class="h d" x="996" y="240">GitHub Pages</text>
  <text class="h d" x="996" y="264">自动构建</text>

  <line x1="60" y1="330" x2="1140" y2="330" stroke="#E7E5E4" stroke-width="1.5" />
  <text class="h d" x="60" y="364">同样的文件，既是站点的数据源，也是本机中台的编辑器对象 —— 中间没有任何服务在跑。</text>
</svg>
